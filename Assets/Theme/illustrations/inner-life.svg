<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Jeevan: atma at the centre, followed outward by buddhi, citta, vritti and mun"><rect width="800" height="480" fill="#F7F4EF"/><g transform="translate(60 70) scale(1.4)"><circle class="faculty" cx="120" cy="120" r="34" fill="none" stroke="var(--amd-icon,#1A5276)" stroke-width="4.5"/><circle class="faculty" cx="120" cy="120" r="54" fill="none" stroke="var(--amd-icon,#1A5276)" stroke-width="4.5"/><circle class="faculty" cx="120" cy="120" r="74" fill="none" stroke="var(--amd-icon,#1A5276)" stroke-width="4.5"/><circle class="faculty" cx="120" cy="120" r="94" fill="none" stroke="var(--amd-icon,#1A5276)" stroke-width="4.5"/><circle cx="120" cy="120" r="13" fill="var(--amd-accent,#B47B46)" stroke="none"/></g><text x="425" y="85" font-family="Calibri,Segoe UI,sans-serif" font-size="36" fill="#1A5276">Jeevan</text><text x="425" y="151" font-family="Calibri,Segoe UI,sans-serif" font-size="22" fill="#1A5276">Atma · centre</text><text x="425" y="199" font-family="Calibri,Segoe UI,sans-serif" font-size="22" fill="#1A5276">Buddhi · first orbit</text><text x="425" y="247" font-family="Calibri,Segoe UI,sans-serif" font-size="22" fill="#1A5276">Citta · second orbit</text><text x="425" y="295" font-family="Calibri,Segoe UI,sans-serif" font-size="22" fill="#1A5276">Vritti · third orbit</text><text x="425" y="343" font-family="Calibri,Segoe UI,sans-serif" font-size="22" fill="#1A5276">Mun · outermost orbit</text><text x="65" y="444" font-family="Calibri,Segoe UI,sans-serif" font-size="20" fill="#1A5276">One conscious unit · five integral faculties</text></svg>