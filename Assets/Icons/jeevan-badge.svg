  <title id="t">Jeevan badge — saturated within satta</title>
  <desc id="d">A rounded navy field, representing saturation within satta. The jeevan unit: a central atma nucleus, four faculty nodes (mun, vritti, chitta and buddhi) on one orbit, and projection and reflection as a single continuous cycle.</desc>
