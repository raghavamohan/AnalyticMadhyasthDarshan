<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img">
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#28717a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#28717a"/></marker></defs>
<rect width="720" height="640" fill="white"/>
<text x="360" y="32" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle" fill="#183c47">Five coordinated social functions</text>
<rect x="65" y="65" width="590" height="76" rx="12" fill="#edf4f2" stroke="#28717a" stroke-width="2"/><text x="360.0" y="100" font-family="Arial" font-size="23" font-weight="700" text-anchor="middle" fill="#183c47">1. Education - sanskar</text><text x="360.0" y="132" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#183c47">Understanding and formation in living</text>
<rect x="65" y="153" width="590" height="76" rx="12" fill="#edf4f2" stroke="#28717a" stroke-width="2"/><text x="360.0" y="188" font-family="Arial" font-size="23" font-weight="700" text-anchor="middle" fill="#183c47">2. Justice - protection</text><text x="360.0" y="220" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#183c47">Fulfilment of relationships and safeguarding</text>
<rect x="65" y="241" width="590" height="76" rx="12" fill="#edf4f2" stroke="#28717a" stroke-width="2"/><text x="360.0" y="276" font-family="Arial" font-size="23" font-weight="700" text-anchor="middle" fill="#183c47">3. Production - work</text><text x="360.0" y="308" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#183c47">Competent work for actual material provision</text>
<rect x="65" y="329" width="590" height="76" rx="12" fill="#edf4f2" stroke="#28717a" stroke-width="2"/><text x="360.0" y="364" font-family="Arial" font-size="23" font-weight="700" text-anchor="middle" fill="#183c47">4. Exchange - reserves</text><text x="360.0" y="396" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#183c47">Circulation, sharing and continuity of provision</text>
<rect x="65" y="417" width="590" height="76" rx="12" fill="#edf4f2" stroke="#28717a" stroke-width="2"/><text x="360.0" y="452" font-family="Arial" font-size="23" font-weight="700" text-anchor="middle" fill="#183c47">5. Health - restraint</text><text x="360.0" y="484" font-family="Arial" font-size="18" font-weight="400" text-anchor="middle" fill="#183c47">Bodily care with humane regulation</text>
<text x="360" y="543" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#183c47">Resolution, prosperity, trust and coexistence</text>
<text x="360" y="582" font-family="Arial" font-size="19" font-weight="400" text-anchor="middle" fill="#183c47">Coordination across all ten council levels,</text><text x="360" y="610" font-family="Arial" font-size="19" font-weight="400" text-anchor="middle" fill="#183c47">from family participation to the world-family council.</text>
<path d="M45,100 L22,100 L22,455 L45,455 M675,100 L698,100 L698,455 L675,455" fill="none" stroke="#28717a" stroke-width="3"/>
</svg>
