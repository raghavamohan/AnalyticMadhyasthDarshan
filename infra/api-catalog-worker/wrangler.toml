name = "amd-api-catalog"
main = "src/index.js"
compatibility_date = "2024-03-01"

# Canonical JSON lives in src/api-catalog.json (kept identical to
# .well-known/api-catalog). The committed src/index.js is the local/dev
# module. Production upload is a self-contained module generated in memory by
# Scripts/_publish_api_catalog_snippet.py.
# A zone Workers Route needs Workers Routes Edit. Until then --apply-redirect
# sends /.well-known/api-catalog to workers.dev.
workers_dev = true
