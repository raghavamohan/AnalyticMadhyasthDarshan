name = "amd-mcp"
main = "src/index.js"
compatibility_date = "2024-03-01"

# src/index.js is generated by Scripts/_publish_mcp_server_card.py from src/runtime.js.
# A zone Workers Route needs Workers Routes Edit. Until then --apply-redirect
# sends /.well-known/mcp/* (302) and /mcp plus /api/studies (308) to workers.dev.
workers_dev = true
