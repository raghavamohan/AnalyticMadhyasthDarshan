name = "amd-mcp"
main = "src/index.js"
compatibility_date = "2024-03-01"
# Read the uncached marker and pinned files through the public site Worker.
# Without strictly-public routing, same-zone fetches bypass amd-site and hit
# the old origin, where the publication marker does not exist.
compatibility_flags = ["cache_option_enabled", "global_fetch_strictly_public"]

# src/index.js is generated by Scripts/_publish_mcp_server_card.py from src/runtime.js.
# Zone Workers Routes: /.well-known/mcp/*, /mcp*, /api/studies*.
workers_dev = true
