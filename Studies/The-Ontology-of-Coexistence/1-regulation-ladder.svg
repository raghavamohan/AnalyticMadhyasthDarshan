<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <title>Regulation ladder from Omnipresence to higher orders</title>
  <desc>How regulation through saturation in Omnipresence becomes evident through law, order conformance, inward regulation, justice, and self-governance.</desc>
  <style>
    .bg { fill: #FCFBF8; }
    .box { fill: #FFFFFF; stroke: #C2CED6; }
    .box-ground { fill: #E9F0F4; stroke: #9DB4C2; }
    .box-warm { fill: #FFF8E7; stroke: #D4A843; }
    .box-purple { fill: #ECE7F6; stroke: #5B3FA0; }
    .box-green { fill: #E8F0E4; stroke: #4A7A3A; }
    .title { fill: #1F2D3A; }
    .sub { fill: #5A6B78; }
    .ink { fill: #3F4D57; }
    .ink-blue { fill: #2F5168; }
    .ink-gold { fill: #7A6420; }
    .ink-purple { fill: #4A2F8C; }
    .ink-green { fill: #2F5A40; }
    .stroke-muted { stroke: #5E7686; }
    .mark-fill { fill: #5E7686; }
    text { font-family: Helvetica, Arial, sans-serif; }
    
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1815; }
    .box { fill: #26231e; stroke: #423b33; }
    .box-ground { fill: #1e2830; stroke: #3d6278; }
    .box-warm { fill: #2a2418; stroke: #c9a227; }
    .box-purple { fill: #241e33; stroke: #5b3fa0; }
    .box-green { fill: #1a2e22; stroke: #355940; }
    .title { fill: #f5f1ec; }
    .sub { fill: #aca194; }
    .ink { fill: #e6dfd6; }
    .ink-blue { fill: #7ebbed; }
    .ink-gold { fill: #f0c78a; }
    .ink-purple { fill: #c4b5fd; }
    .ink-green { fill: #8fd4a8; }
    .stroke-muted { stroke: #6f655a; }
    .mark-fill { fill: #aca194; }
  }

  </style>
  <defs>
    <marker id="ahLadder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="mark-fill"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="420"/>
  <text class="title" x="480" y="28" text-anchor="middle" font-size="18" font-weight="700">Regulation ladder &#8212; Omnipresence to higher orders</text>
  <text class="sub" x="480" y="48" text-anchor="middle" font-size="11">Law is universal; justice closes the bond evaluatively in the knowledge order</text>
  <rect class="box-ground" x="40" y="80" width="110" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-blue" x="95" y="106" text-anchor="middle" font-size="10.5" font-weight="700">OMNIPRESENCE</text>
  <text class="ink" x="95" y="124" text-anchor="middle" font-size="9">satta &#8212; actionless</text>
  <text class="ink" x="95" y="140" text-anchor="middle" font-size="9">mediative ground</text>
  <line x1="150" y1="116" x2="178" y2="116" class="stroke-muted" stroke-width="1.8" marker-end="url(#ahLadder)"/>
  <rect class="box" x="180" y="80" width="110" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-blue" x="235" y="106" text-anchor="middle" font-size="10.5" font-weight="700">SATURATION</text>
  <text class="ink" x="235" y="124" text-anchor="middle" font-size="9">regulation + energy</text>
  <text class="ink" x="235" y="140" text-anchor="middle" font-size="9">IN each unit</text>
  <line x1="290" y1="116" x2="318" y2="116" class="stroke-muted" stroke-width="1.8" marker-end="url(#ahLadder)"/>
  <rect class="box" x="320" y="80" width="110" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-blue" x="375" y="106" text-anchor="middle" font-size="10.5" font-weight="700">LAW</text>
  <text class="ink" x="375" y="124" text-anchor="middle" font-size="9">all orders</text>
  <text class="ink" x="375" y="140" text-anchor="middle" font-size="9">orderliness with -ness</text>
  <line x1="430" y1="116" x2="458" y2="116" class="stroke-muted" stroke-width="1.8" marker-end="url(#ahLadder)"/>
  <rect class="box" x="460" y="80" width="110" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-blue" x="515" y="106" text-anchor="middle" font-size="10.5" font-weight="700">ORDERS</text>
  <text class="ink" x="515" y="124" text-anchor="middle" font-size="9">swatah-saspurt</text>
  <text class="ink" x="515" y="140" text-anchor="middle" font-size="9">conformance regimes</text>
  <line x1="570" y1="116" x2="598" y2="116" class="stroke-muted" stroke-width="1.8" marker-end="url(#ahLadder)"/>
  <rect class="box-warm" x="600" y="80" width="110" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-gold" x="655" y="106" text-anchor="middle" font-size="10.5" font-weight="700">JEEVAN</text>
  <text class="ink" x="655" y="124" text-anchor="middle" font-size="9">inward regulation</text>
  <text class="ink" x="655" y="140" text-anchor="middle" font-size="9">atma &#8594; faculties</text>
  <line x1="710" y1="116" x2="738" y2="116" class="stroke-muted" stroke-width="1.8" marker-end="url(#ahLadder)"/>
  <rect class="box-purple" x="740" y="80" width="110" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-purple" x="795" y="106" text-anchor="middle" font-size="10" font-weight="700">JUSTICE</text>
  <text class="ink" x="795" y="124" text-anchor="middle" font-size="9">recognise &#183; fulfil</text>
  <text class="ink" x="795" y="140" text-anchor="middle" font-size="9">evaluate &#183; mutual</text>
  <line x1="850" y1="116" x2="878" y2="116" class="stroke-muted" stroke-width="1.8" marker-end="url(#ahLadder)"/>
  <rect class="box-green" x="880" y="80" width="60" height="72" rx="8" stroke-width="1.2"/>
  <text class="ink-green" x="910" y="116" text-anchor="middle" font-size="9" font-weight="700">self-</text>
  <text class="ink-green" x="910" y="132" text-anchor="middle" font-size="9" font-weight="700">gov</text>
  <rect class="box" x="40" y="200" width="880" height="180" rx="10" stroke-width="1.2"/>
  <text class="ink-blue" x="480" y="232" text-anchor="middle" font-size="13" font-weight="700">Reading the ladder</text>
  <text class="ink" x="480" y="260" text-anchor="middle" font-size="11">Omnipresence does not issue statutory commands; saturation endows regulation in each unit.</text>
  <text class="ink" x="480" y="284" text-anchor="middle" font-size="11">Below the knowledge order, recognition and fulfilment are definite without the name justice.</text>
  <text class="ink" x="480" y="308" text-anchor="middle" font-size="11">At the knowledge order, jeevan evaluates; justice closes the relational cycle.</text>
  <text class="ink" x="480" y="332" text-anchor="middle" font-size="11">Assembly self-governance and statute are institutional; they may diverge from justice.</text>
  <text class="sub" x="480" y="360" text-anchor="middle" font-size="10.5" font-style="italic">See &#167;1.11&#8211;&#167;1.12; governance detail belongs in the planned governance study.</text>
</svg>
