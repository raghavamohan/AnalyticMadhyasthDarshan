<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" role="img">
  <title>Orders and planes with T1&#8211;T3</title>
  <desc>Orders name definite modes of participation; planes name where development has reached. Animal bodily limitation differs from human body-delusion. T1 is the irreversible sentience threshold; T2 and T3 are awakening milestones within the knowledge order.</desc>
  <style>

    .bg { fill: #FCFBF8; }
    .panel { fill: #FFFFFF; stroke: #C2CED6; }
    .panel-alt { fill: #F4F8F5; stroke: #93B79E; }
    .panel-warm { fill: #F2E7CF; stroke: #CBAE78; }
    .panel-green { fill: #F4F8F5; stroke: #93B79E; }
    .panel-purple { fill: #F3F1F8; stroke: #A39BCB; }
    .panel-blue { fill: #E7F0F9; stroke: #185FA5; }
    .panel-gold { fill: #FFF8E7; stroke: #D4A843; }
    .ground { fill: #E9F0F4; stroke: #9DB4C2; }
    .title { fill: #1F2D3A; }
    .sub { fill: #5A6B78; }
    .ink { fill: #3F4D57; }
    .ink-dim { fill: #5A6B78; }
    .ink-blue { fill: #2F5168; }
    .ink-green { fill: #28402F; }
    .ink-purple { fill: #3A3470; }
    .ink-gold { fill: #7A6420; }
    .ink-warm { fill: #5C4A1E; }
    .stroke-blue { stroke: #5E7686; }
    .stroke-green { stroke: #3F6B52; }
    .stroke-purple { stroke: #6F63A8; }
    .stroke-gold { stroke: #C9A227; }
    .stroke-muted { stroke: #5E7686; }
    .chip { fill: #FFFFFF; stroke: #C2CED6; }
    .chip-hi { fill: #FFF8E7; stroke: #C9A227; }
    .chip-purple { fill: #ECE7F6; stroke: #5B3FA0; }
    .foot { fill: #F7F5F0; stroke: #D8D0C0; }
    .mark-fill { fill: #5E7686; }
    .mark-green { fill: #3F6B52; }
    .mark-purple { fill: #6F63A8; }
    .mark-gold { fill: #C9A227; }
    text { font-family: Helvetica, Arial, sans-serif; }


  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1815; }
    .panel { fill: #26231e; stroke: #423b33; }
    .panel-alt { fill: #1e1b18; stroke: #423b33; }
    .panel-warm { fill: #2a2418; stroke: #6f5a22; }
    .panel-green { fill: #1a2e22; stroke: #355940; }
    .panel-purple { fill: #241e33; stroke: #5b3fa0; }
    .panel-blue { fill: #1a2430; stroke: #3d6278; }
    .panel-gold { fill: #2a2418; stroke: #c9a227; }
    .ground { fill: #1e2830; stroke: #3d6278; }
    .title { fill: #f5f1ec; }
    .sub { fill: #aca194; }
    .ink { fill: #e6dfd6; }
    .ink-dim { fill: #aca194; }
    .ink-blue { fill: #7ebbed; }
    .ink-green { fill: #8fd4a8; }
    .ink-purple { fill: #c4b5fd; }
    .ink-gold { fill: #f0c78a; }
    .ink-warm { fill: #f0c78a; }
    .stroke-blue { stroke: #7ebbed; }
    .stroke-green { stroke: #8fd4a8; }
    .stroke-purple { stroke: #c4b5fd; }
    .stroke-gold { stroke: #f0c78a; }
    .stroke-muted { stroke: #6f655a; }
    .chip { fill: #2f2a24; stroke: #423b33; }
    .chip-hi { fill: #2a2418; stroke: #c9a227; }
    .chip-purple { fill: #241e33; stroke: #5b3fa0; }
    .foot { fill: #26231e; stroke: #423b33; }
    .mark-fill { fill: #aca194; }
    .mark-green { fill: #8fd4a8; }
    .mark-purple { fill: #c4b5fd; }
    .mark-gold { fill: #f0c78a; }
  }

  </style>
  <defs>
    <marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" class="stroke-purple" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="8" y="8" width="724" height="384" rx="16" stroke="#D8D6CD" stroke-width="1.5"/>
  <text class="title" x="40" y="40" font-size="14" font-weight="700">Orders &#8212; mode of participation</text>
  <text class="title" x="400" y="40" font-size="14" font-weight="700">Planes &#8212; where it has REACHED</text>
  <rect class="panel-blue" x="40" y="58" width="200" height="48" rx="8" stroke-width="0.8"/>
  <text class="ink-blue" x="56" y="78" font-size="11" font-weight="700">Material (padarth)</text>
  <text class="ink-dim" x="56" y="94" font-size="9">dharma: existence</text>
  <rect class="panel-blue" x="40" y="116" width="200" height="48" rx="8" stroke-width="0.8"/>
  <text class="ink-blue" x="56" y="136" font-size="11" font-weight="700">Bio / pranic (pran)</text>
  <text class="ink-dim" x="56" y="152" font-size="9">+ growth</text>
  <rect class="panel-green" x="40" y="174" width="200" height="48" rx="8" stroke-width="0.8"/>
  <text class="ink-green" x="56" y="194" font-size="11" font-weight="700">Animal (jeev)</text>
  <text class="ink-dim" x="56" y="210" font-size="9">+ hope to live</text>
  <rect class="panel-purple" x="40" y="232" width="200" height="72" rx="8" stroke-width="0.8"/>
  <text class="ink-purple" x="56" y="254" font-size="11" font-weight="700">Knowledge / human (gyan)</text>
  <text class="ink-dim" x="56" y="272" font-size="9">+ happiness</text>
  <text class="ink-dim" x="56" y="288" font-size="9">happiness &#8594; bliss path</text>
  <rect class="panel-blue" x="400" y="58" width="300" height="96" rx="8" stroke-width="0.8"/>
  <circle cx="418" cy="78" r="8" class="mark-fill"/><text x="418" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#FCFBF8">1</text>
  <text class="ink-blue" x="434" y="82" font-size="11" font-weight="700">Physicochemical plane</text>
  <text class="ink" x="434" y="100" font-size="10">material + bio orders</text>
  <text class="ink-dim" x="434" y="116" font-size="9">insentient development toward T1</text>
  <text class="ink-dim" x="434" y="132" font-size="9">compositional support, not awakening</text>
  <rect class="panel-green" x="400" y="174" width="300" height="48" rx="8" stroke-width="0.8"/>
  <circle cx="418" cy="192" r="8" class="mark-green"/><text x="418" y="196" text-anchor="middle" font-size="10" font-weight="700" fill="#FCFBF8">2</text>
  <text class="ink-green" x="434" y="192" font-size="11" font-weight="700">Before awakening / delusional plane</text>
  <text class="ink" x="434" y="210" font-size="9.5">animal: bodily limit &#183; human: body-delusion</text>
  <rect class="panel-purple" x="400" y="232" width="300" height="48" rx="8" stroke-width="0.8"/>
  <circle cx="418" cy="250" r="8" class="mark-purple"/><text x="418" y="254" text-anchor="middle" font-size="10" font-weight="700" fill="#FCFBF8">3</text>
  <text class="ink-purple" x="434" y="250" font-size="11" font-weight="700">Deific plane</text>
  <text class="ink" x="434" y="268" font-size="10">T2 &#183; restfulness / activity completeness</text>
  <rect class="panel-alt" x="400" y="290" width="300" height="48" rx="8" stroke-width="0.8"/>
  <circle cx="418" cy="308" r="8" class="mark-green"/><text x="418" y="312" text-anchor="middle" font-size="10" font-weight="700" fill="#FCFBF8">4</text>
  <text class="ink-green" x="434" y="308" font-size="11" font-weight="700">Divine (complete) plane</text>
  <text class="ink" x="434" y="326" font-size="10">T3 &#183; living proof / conduct completeness</text>
  <line x1="240" y1="108" x2="398" y2="108" class="stroke-muted" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="240" y1="198" x2="398" y2="198" class="stroke-muted" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="240" y1="256" x2="398" y2="256" class="stroke-muted" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="240" y1="280" x2="398" y2="280" class="stroke-muted" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="240" y1="314" x2="398" y2="314" class="stroke-muted" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="620" y1="154" x2="620" y2="174" class="stroke-gold" stroke-width="2" marker-end="url(#arP)"/>
  <text class="ink-gold" x="700" y="168" text-anchor="end" font-size="10">T1 constitutional (irreversible)</text>
  <line x1="620" y1="222" x2="620" y2="232" class="stroke-purple" stroke-width="1.5" marker-end="url(#arP)"/>
  <text class="ink-purple" x="700" y="228" text-anchor="end" font-size="10">T2 activity</text>
  <line x1="620" y1="280" x2="620" y2="290" class="stroke-purple" stroke-width="1.5" marker-end="url(#arP)"/>
  <text class="ink-purple" x="700" y="286" text-anchor="end" font-size="10">T3 conduct</text>
  <text class="ink-dim" x="40" y="340" font-size="9.5">dharma is cumulative &#8212; each order carries those below it</text>
  <text class="ink-dim" x="40" y="358" font-size="9.5">hope (animal) &#8800; happiness&#8594;bliss (knowledge)</text>
  <text class="ink-dim" x="400" y="358" font-size="9.5">one knowledge order spans planes 2&#8211;4</text>
  <text class="ink-dim" x="40" y="376" font-size="9.5">T1 = atomic sentience threshold; T2/T3 = awakening within jeevan</text>
</svg>
