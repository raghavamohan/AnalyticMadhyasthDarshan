<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Conceptual scope of modern scientific approaches</title>
<desc>Scientific inquiry proceeds from public observation, instrumentation, modelling and correction into connected domains: cosmology and spacetime; fields, particles and conservation; thermodynamics, living organisation and evolution; mind and self-models; competing theories of consciousness; and ecology and cooperation. The results constrain metaphysics but do not alone establish physicalism, an immortal self, moral obligation or ultimate purpose.</desc>
<style>
  .bg { fill: #FCFBF8; }
  .box { fill: #E7F0F9; stroke: #185FA5; stroke-width: 1.2; }
  .life { fill: #E3F0EC; stroke: #0F6E56; stroke-width: 1.2; }
  .mind { fill: #F3EAF7; stroke: #7A4E91; stroke-width: 1.2; }
  .limit { fill: #FBF0DA; stroke: #B8860B; stroke-width: 1.2; }
  .title { fill: #1A1A18; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 25px; font-weight: 700; }
  .h { fill: #1A1A18; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
  .t { fill: #56554F; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; }
  .line { stroke: #56554F; stroke-width: 1.4; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1815; }
    .box { fill: #1a2430; stroke: #4a7a9b; }
    .life { fill: #1a2e22; stroke: #4a8a6a; }
    .mind { fill: #241e33; stroke: #7c6bc4; }
    .limit { fill: #2a2418; stroke: #c9a227; }
    .title, .h { fill: #f5f1ec; }
    .t { fill: #aca194; }
    .line { stroke: #aca194; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/>
  </marker>
</defs>
<rect class="bg" width="1040" height="760"/>
<text class="title" x="520" y="42" text-anchor="middle">Empirical constraint without metaphysical overreach</text>

<rect class="box" x="250" y="76" width="540" height="80" rx="12"/>
<text class="h" x="520" y="105" text-anchor="middle">Public scientific inquiry</text>
<text class="t" x="520" y="128" text-anchor="middle">observation &#183; instrumentation &#183; mathematical models &#183; intervention &#183; replication &#183; criticism</text>

<path class="line" d="M520 156V186" marker-end="url(#arrow)"/>

<rect class="box" x="70" y="205" width="270" height="86" rx="11"/>
<text class="h" x="205" y="233" text-anchor="middle">Cosmology and spacetime</text>
<text class="t" x="205" y="256" text-anchor="middle">observable history &#183; geometry</text>
<text class="t" x="205" y="274" text-anchor="middle">absolute beginning remains open</text>

<rect class="box" x="385" y="205" width="270" height="86" rx="11"/>
<text class="h" x="520" y="233" text-anchor="middle">Fields and conservation</text>
<text class="t" x="520" y="256" text-anchor="middle">excitations &#183; symmetries &#183; dynamics</text>
<text class="t" x="520" y="274" text-anchor="middle">no field equals actionless satta</text>

<rect class="life" x="700" y="205" width="270" height="86" rx="11"/>
<text class="h" x="835" y="233" text-anchor="middle">Thermodynamics and life</text>
<text class="t" x="835" y="256" text-anchor="middle">entropy &#183; autopoiesis &#183; evolution</text>
<text class="t" x="835" y="274" text-anchor="middle">organisation is not yet sentience</text>

<path class="line" d="M205 291V337" marker-end="url(#arrow)"/>
<path class="line" d="M520 291V337" marker-end="url(#arrow)"/>
<path class="line" d="M835 291V337" marker-end="url(#arrow)"/>

<rect class="mind" x="70" y="356" width="270" height="92" rx="11"/>
<text class="h" x="205" y="384" text-anchor="middle">Mind and self-models</text>
<text class="t" x="205" y="407" text-anchor="middle">embodiment &#183; prediction &#183; agency</text>
<text class="t" x="205" y="425" text-anchor="middle">bearer and survival remain disputed</text>

<rect class="mind" x="385" y="356" width="270" height="92" rx="11"/>
<text class="h" x="520" y="384" text-anchor="middle">Consciousness theories</text>
<text class="t" x="520" y="407" text-anchor="middle">GNWT &#183; HOT &#183; recurrent processing &#183; IIT</text>
<text class="t" x="520" y="425" text-anchor="middle">competing measurable predictions</text>

<rect class="life" x="700" y="356" width="270" height="92" rx="11"/>
<text class="h" x="835" y="384" text-anchor="middle">Ecology and cooperation</text>
<text class="t" x="835" y="407" text-anchor="middle">networks &#183; selection &#183; reciprocity</text>
<text class="t" x="835" y="425" text-anchor="middle">function does not settle obligation</text>

<path class="line" d="M205 448V494H520"/>
<path class="line" d="M520 448V512" marker-end="url(#arrow)"/>
<path class="line" d="M835 448V494H520"/>

<rect class="limit" x="165" y="531" width="710" height="148" rx="14"/>
<text class="h" x="520" y="562" text-anchor="middle">What the evidence constrains</text>
<text class="t" x="520" y="588" text-anchor="middle">mechanisms &#183; quantitative relations &#183; histories &#183; viable and falsified models</text>
<text class="h" x="520" y="623" text-anchor="middle">What does not follow from success alone</text>
<text class="t" x="520" y="649" text-anchor="middle">metaphysical physicalism &#183; absolute cosmic beginning &#183; no possible non-physical bearer</text>
<text class="t" x="520" y="668" text-anchor="middle">moral obligation &#183; ultimate purpose &#183; confirmation of immortal jeevan</text>
</svg>
