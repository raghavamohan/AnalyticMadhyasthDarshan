<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" role="img">
  <title>Madhyasth Darshan &#8212; architecture of coexistence</title>
  <desc>Overview: Omnipresence and units bound by saturation; the ontological entailment from saturation to activity, for which no separate physical mechanism is stated; four orders that are not an individual transformation ladder; separate compositional and atomic-development paths; T1 as sentient jeevan; and T2 realisation followed by T3 authentic conduct evidenced in living.</desc>
  <style>

    .bg { fill: #FCFBF8; }
    .panel { fill: #FFFFFF; stroke: #C2CED6; }
    .panel-alt { fill: #F4F8F5; stroke: #93B79E; }
    .panel-warm { fill: #F2E7CF; stroke: #CBAE78; }
    .panel-green { fill: #F4F8F5; stroke: #93B79E; }
    .panel-purple { fill: #F3F1F8; stroke: #A39BCB; }
