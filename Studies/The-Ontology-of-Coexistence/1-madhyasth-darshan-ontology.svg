    .panel-green { fill: #1a2e22; stroke: #355940; }
    .panel-purple { fill: #241e33; stroke: #5b3fa0; }
    .panel-blue { fill: #1a2430; stroke: #3d6278; }
    .panel-gold { fill: #2a2418; stroke: #c9a227; }
    .ground { fill: #1e2830; stroke: #3d6278; }
    .title { fill: #f5f1ec; }
    .sub { fill: #aca194; }
    .ink { fill: #e6dfd6; }
    .ink-dim { fill: #aca194; }
    .ink-blue { fill: #7ebbed; }
    .ink-green { fill: #8fd4a8; }
    .ink-purple { fill: #c4b5fd; }
    .ink-gold { fill: #f0c78a; }
    .ink-warm { fill: #f0c78a; }
    .stroke-blue { stroke: #7ebbed; }
    .stroke-green { stroke: #8fd4a8; }
    .stroke-purple { stroke: #c4b5fd; }
