<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage cascade of jeevan</title>
  <desc id="desc">Satta is an actionless reference available for realisation, not a command. Five faculties form a cascade from atma innermost to mun outermost. At each stage a state activity establishes content and a motion activity acts toward the next outer plant. Signal travels inner to outer. Pratyavartan is reflection inward, enabled by receptivity at each coupling. Unresolved content may raise inquiry, but inquiry is not itself pratyavartan. The body is mun's plant, reached through prana, heart, and medhas. The field is the joint form's plant.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527059"/>
    </marker>
    <style>
      .heading { font: 700 22px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 18px Arial, Helvetica, sans-serif; fill: #27364b; }
      .small { font: 16px Arial, Helvetica, sans-serif; fill: #34445b; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .faculty { font: 700 20px Arial, Helvetica, sans-serif; fill: #172033; }
      .boundary-label { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 0.6px; fill: #92400e; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.8; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #2773a5; stroke-width: 2.8; marker-end: url(#arrow); }
      .reflection { fill: none; stroke: #c77b16; stroke-width: 2.8; marker-end: url(#arrow); }
      .bidirectional { fill: none; stroke: #4f6b85; stroke-width: 2.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .reference { fill: none; stroke: #527059; stroke-width: 2.8; stroke-dasharray: 9 7; marker-end: url(#arrow-green); }
      .label-bg { fill: #ffffff; fill-opacity: 0.95; }
    </style>
  </defs>

  <rect width="1200" height="1320" fill="#ffffff"/>

  <rect x="280" y="18" width="640" height="88" rx="16" fill="#edf8f0" stroke="#527059" stroke-width="3"/>
  <text x="600" y="52" text-anchor="middle" class="heading">Satta and coexistence</text>
  <text x="600" y="82" text-anchor="middle" class="small">actionless Knowledge &#8212; available for realisation, not a command</text>

  <path class="reference" d="M 600 106 V 148"/>
  <rect x="508" y="112" width="184" height="22" rx="4" class="label-bg"/>
  <text x="600" y="129" text-anchor="middle" class="label">reference for anubhav</text>

  <rect x="70" y="148" width="1060" height="718" rx="20" fill="#fffaf0" stroke="#b45309" stroke-width="5"/>
  <text x="600" y="178" text-anchor="middle" class="boundary-label">JEEVAN &#8212; FIVE-STAGE CASCADE</text>
  <text x="600" y="202" text-anchor="middle" class="small">each inner faculty is the reference for the next outer one</text>

  <!-- Atma -->
  <rect x="220" y="220" width="760" height="88" rx="12" fill="#f3e8ff" stroke="#7e57a3" stroke-width="2.4"/>
  <text x="250" y="255" class="faculty">Atma</text>
  <text x="250" y="282" class="small">nucleus</text>
  <text x="520" y="255" class="body">state: realisation</text>
  <text x="520" y="282" class="small">anubhav</text>
  <text x="780" y="255" class="body">motion: authenticity</text>
  <text x="780" y="282" class="small">pramanikta &#183; evidence</text>

  <path class="signal" d="M 360 308 V 348"/>
  <rect x="248" y="314" width="92" height="20" rx="4" class="label-bg"/>
  <text x="294" y="329" text-anchor="middle" class="label">signal</text>
  <path class="reflection" d="M 840 348 V 308"/>
  <rect x="798" y="314" width="92" height="20" rx="4" class="label-bg"/>
  <text x="844" y="329" text-anchor="middle" class="label">reflection</text>
  <rect x="548" y="318" width="104" height="22" rx="8" fill="#fff7ed" stroke="#c77b16" stroke-width="1.6"/>
  <text x="600" y="334" text-anchor="middle" class="label">gate</text>

  <!-- Buddhi -->
  <rect x="220" y="348" width="760" height="88" rx="12" fill="#e9f5ff" stroke="#2773a5" stroke-width="2.4"/>
  <text x="250" y="383" class="faculty">Buddhi</text>
  <text x="250" y="410" class="small">first orbit</text>
  <text x="520" y="383" class="body">state: enlightenment</text>
  <text x="520" y="410" class="small">bodh</text>
  <text x="780" y="383" class="body">motion: resolve</text>
  <text x="780" y="410" class="small">sankalp &#183; resoluteness</text>

  <path class="signal" d="M 360 436 V 476"/>
  <rect x="248" y="442" width="92" height="20" rx="4" class="label-bg"/>
  <text x="294" y="457" text-anchor="middle" class="label">signal</text>
  <path class="reflection" d="M 840 476 V 436"/>
  <rect x="798" y="442" width="92" height="20" rx="4" class="label-bg"/>
  <text x="844" y="457" text-anchor="middle" class="label">reflection</text>
  <rect x="548" y="446" width="104" height="22" rx="8" fill="#fff7ed" stroke="#c77b16" stroke-width="1.6"/>
  <text x="600" y="462" text-anchor="middle" class="label">gate</text>

  <!-- Chitta -->
  <rect x="220" y="476" width="760" height="88" rx="12" fill="#fff2d6" stroke="#c77b16" stroke-width="2.4"/>
  <text x="250" y="511" class="faculty">Chitta</text>
  <text x="250" y="538" class="small">second orbit</text>
  <text x="520" y="511" class="body">state: contemplation</text>
  <text x="520" y="538" class="small">chintan</text>
  <text x="780" y="511" class="body">motion: visualisation</text>
  <text x="780" y="538" class="small">chitran &#183; desire</text>

  <path class="signal" d="M 360 564 V 604"/>
  <rect x="248" y="570" width="92" height="20" rx="4" class="label-bg"/>
  <text x="294" y="585" text-anchor="middle" class="label">signal</text>
  <path class="reflection" d="M 840 604 V 564"/>
  <rect x="798" y="570" width="92" height="20" rx="4" class="label-bg"/>
  <text x="844" y="585" text-anchor="middle" class="label">reflection</text>
  <rect x="548" y="574" width="104" height="22" rx="8" fill="#fff7ed" stroke="#c77b16" stroke-width="1.6"/>
  <text x="600" y="590" text-anchor="middle" class="label">gate</text>

  <!-- Vritti -->
  <rect x="220" y="604" width="760" height="88" rx="12" fill="#eef4fa" stroke="#4f6b85" stroke-width="2.4"/>
  <text x="250" y="639" class="faculty">Vritti</text>
  <text x="250" y="666" class="small">third orbit</text>
  <text x="520" y="639" class="body">state: deliberation</text>
  <text x="520" y="666" class="small">tulan</text>
  <text x="780" y="639" class="body">motion: analysis</text>
  <text x="780" y="666" class="small">vishleshan &#183; thought</text>

  <path class="signal" d="M 360 692 V 732"/>
  <rect x="248" y="698" width="92" height="20" rx="4" class="label-bg"/>
  <text x="294" y="713" text-anchor="middle" class="label">signal</text>
  <path class="reflection" d="M 840 732 V 692"/>
  <rect x="798" y="698" width="92" height="20" rx="4" class="label-bg"/>
  <text x="844" y="713" text-anchor="middle" class="label">reflection</text>
  <rect x="548" y="702" width="104" height="22" rx="8" fill="#fff7ed" stroke="#c77b16" stroke-width="1.6"/>
  <text x="600" y="718" text-anchor="middle" class="label">gate</text>

  <!-- Mun -->
  <rect x="220" y="732" width="760" height="88" rx="12" fill="#f1f0ff" stroke="#6557a5" stroke-width="2.4"/>
  <text x="250" y="767" class="faculty">Mun</text>
  <text x="250" y="794" class="small">fourth orbit</text>
  <text x="520" y="767" class="body">state: taste</text>
  <text x="520" y="794" class="small">asvadan</text>
  <text x="780" y="767" class="body">motion: selection</text>
  <text x="780" y="794" class="small">chayan &#183; hope</text>

  <text x="130" y="430" text-anchor="middle" class="label" transform="rotate(-90 130 430)">inner</text>
  <text x="1070" y="430" text-anchor="middle" class="label" transform="rotate(90 1070 430)">outer</text>
  <text x="130" y="620" text-anchor="middle" class="small" transform="rotate(-90 130 620)">realised reference-centre</text>
  <text x="1070" y="620" text-anchor="middle" class="small" transform="rotate(90 1070 620)">nearest the body</text>

  <path class="arrow" d="M 600 820 V 868"/>
  <rect x="508" y="828" width="184" height="22" rx="4" class="label-bg"/>
  <text x="600" y="845" text-anchor="middle" class="label">mun's plant</text>

  <!-- Embodied interface stages -->
  <rect x="70" y="868" width="1060" height="150" rx="16" fill="#eef4fa" stroke="#4f6b85" stroke-width="3"/>
  <text x="600" y="896" text-anchor="middle" class="heading">Embodied interface &#8212; not the bearer of sanskar</text>

  <rect x="110" y="916" width="300" height="78" rx="10" fill="#ffffff" stroke="#4f6b85" stroke-width="2"/>
  <text x="260" y="948" text-anchor="middle" class="faculty">Prana</text>
  <text x="260" y="974" text-anchor="middle" class="small">gross&#8211;subtle coupling</text>

  <rect x="450" y="916" width="300" height="78" rx="10" fill="#ffffff" stroke="#4f6b85" stroke-width="2"/>
  <text x="600" y="948" text-anchor="middle" class="faculty">Heart</text>
  <text x="600" y="974" text-anchor="middle" class="small">four instincts as innateness</text>

  <rect x="790" y="916" width="300" height="78" rx="10" fill="#ffffff" stroke="#4f6b85" stroke-width="2"/>
  <text x="940" y="948" text-anchor="middle" class="faculty">Medhas and body</text>
  <text x="940" y="974" text-anchor="middle" class="small">senses, speech, action, work</text>

  <path class="bidirectional" d="M 410 955 H 450"/>
  <path class="bidirectional" d="M 750 955 H 790"/>

  <path class="arrow" d="M 600 1018 V 1068"/>
  <rect x="478" y="1026" width="244" height="22" rx="4" class="label-bg"/>
  <text x="600" y="1043" text-anchor="middle" class="label">joint form's plant</text>

  <rect x="200" y="1068" width="800" height="88" rx="16" fill="#f1f0ff" stroke="#6557a5" stroke-width="3"/>
  <text x="600" y="1102" text-anchor="middle" class="heading">Controlled field</text>
  <text x="600" y="1134" text-anchor="middle" class="body">relationship, work, exchange, society, participation in nature</text>

  <text x="600" y="1198" text-anchor="middle" class="body">A gate is receptivity at that coupling: success or failure, not a gain.</text>
  <text x="600" y="1228" text-anchor="middle" class="small">Signal projects outward; pratyavartan is reflection inward. Feedback may occasion inquiry but is not itself reflection.</text>
  <text x="600" y="1256" text-anchor="middle" class="small">Delusion leaves four and a half activities effective; intermediate depths reconnect stages; awakening is the full cascade.</text>
  <text x="600" y="1284" text-anchor="middle" class="small">Three of four gates depend on orderliness, societal conduct, and study &#8212; the unit's loop is not closed inside the unit.</text>
</svg>
