<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
  <title id="title">Understanding, expression, and inquiry in jeevan</title>
  <desc id="desc">The awakened jeevan cycle combines paravartan and pratyavartan among the five faculties. Indication proceeds from inner to outer. In the directional sense adopted here, pratyavartan is reflective accord: the outer orientation comes under the inner, not as returned data. Receptivity enables accord. Inquiry is represented separately: unresolved content or bodily consequence may occasion a question without becoming pratyavartan. Dream directly attests shallow recurrence without bodily execution; extending recurrence to the complete cycle is a model hypothesis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 700 25px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 20px Arial, Helvetica, sans-serif; fill: #27364b; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #34445b; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .boundary-label { font: 700 19px Arial, Helvetica, sans-serif; letter-spacing: 0.7px; fill: #92400e; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3.2; marker-end: url(#arrow); }
      .conditional { fill: none; stroke: #52677c; stroke-width: 3.2; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #527059; stroke-width: 3.2; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; fill-opacity: 0.95; }
    </style>
  </defs>

  <rect width="1200" height="990" fill="#ffffff"/>

  <rect x="340" y="25" width="520" height="110" rx="17" fill="#edf8f0" stroke="#527059" stroke-width="3"/>
  <text x="600" y="62" text-anchor="middle" class="heading">Knowledge reference</text>
  <text x="600" y="94" text-anchor="middle" class="body">Satta and coexistence: units saturated in Omnipresence</text>
  <text x="600" y="121" text-anchor="middle" class="small">available for realisation &#8212; not a command</text>

  <rect x="50" y="185" width="1100" height="360" rx="22" fill="#fffaf0" stroke="#b45309" stroke-width="5"/>
  <text x="600" y="220" text-anchor="middle" class="boundary-label">JEEVAN &#8212; AWAKENED CYCLE</text>

  <rect x="80" y="285" width="300" height="225" rx="14" fill="#f3e8ff" stroke="#7e57a3" stroke-width="2.5"/>
  <text x="230" y="330" text-anchor="middle" class="heading">Established orientation</text>
  <text x="230" y="371" text-anchor="middle" class="body">bal, established across</text>
  <text x="230" y="399" text-anchor="middle" class="body">all five faculties</text>
  <text x="230" y="443" text-anchor="middle" class="small">sanskar: four outer faculties</text>
  <text x="230" y="471" text-anchor="middle" class="small">atma: realised reference</text>

  <rect x="450" y="285" width="300" height="225" rx="14" fill="#e9f5ff" stroke="#2773a5" stroke-width="2.5"/>
  <text x="600" y="322" text-anchor="middle" class="heading">Projection</text>
  <text x="600" y="352" text-anchor="middle" class="body">paravartan &#183; indication outward</text>
  <text x="600" y="390" text-anchor="middle" class="small">inner state is the reference</text>
  <text x="600" y="418" text-anchor="middle" class="small">motion reaches the next outward faculty</text>
  <text x="600" y="446" text-anchor="middle" class="small">orientations become evidenced</text>
  <text x="600" y="474" text-anchor="middle" class="small">selection may reach the body</text>
  <text x="600" y="502" text-anchor="middle" class="small">atma &#8594; mun &#8594; body</text>

  <rect x="820" y="285" width="300" height="125" rx="14" fill="#fff2d6" stroke="#c77b16" stroke-width="2.5"/>
  <text x="970" y="318" text-anchor="middle" class="heading">Reflective accord</text>
  <text x="970" y="348" text-anchor="middle" class="small">receptivity enables reception</text>
  <text x="970" y="376" text-anchor="middle" class="small">pratyavartan: the outer</text>
  <text x="970" y="400" text-anchor="middle" class="small">comes under the inner</text>

  <rect x="820" y="425" width="300" height="85" rx="14" fill="#fff7ed" stroke="#c77b16" stroke-width="2.5"/>
  <text x="970" y="454" text-anchor="middle" class="heading">Inquiry</text>
  <text x="970" y="480" text-anchor="middle" class="small">a question may be borne inward</text>
  <text x="970" y="502" text-anchor="middle" class="small">not as a copy of the result</text>

  <path class="arrow" d="M 380 355 H 450"/>
  <rect x="384" y="326" width="62" height="24" rx="4" class="label-bg"/>
  <text x="415" y="345" text-anchor="middle" class="label">orients</text>

  <path class="arrow" d="M 750 355 H 820"/>
  <rect x="744" y="316" width="82" height="48" rx="5" class="label-bg"/>
  <text x="785" y="336" text-anchor="middle" class="label">accord</text>
  <text x="785" y="357" text-anchor="middle" class="label">inward</text>

  <path class="arrow" d="M 970 285 V 255 H 230 V 285"/>
  <rect x="506" y="239" width="188" height="25" rx="4" class="label-bg"/>
  <text x="600" y="258" text-anchor="middle" class="label">establishes or refines orientation</text>

  <path class="reference" d="M 340 80 H 24 V 355 H 80"/>
  <rect x="31" y="145" width="191" height="26" rx="4" class="label-bg"/>
  <text x="126" y="165" text-anchor="middle" class="label">reference for realisation</text>

  <rect x="100" y="650" width="430" height="110" rx="16" fill="#eef4fa" stroke="#4f6b85" stroke-width="3"/>
  <text x="315" y="691" text-anchor="middle" class="heading">Conditional embodiment</text>
  <text x="315" y="724" text-anchor="middle" class="body">prana, heart, medhas, and body</text>

  <rect x="690" y="650" width="410" height="110" rx="16" fill="#f1f0ff" stroke="#6557a5" stroke-width="3"/>
  <text x="895" y="691" text-anchor="middle" class="heading">Embodied result</text>
  <text x="895" y="724" text-anchor="middle" class="body">bodily, material, and relational consequence</text>

  <path class="conditional" d="M 600 510 V 600 H 315 V 650"/>
  <rect x="350" y="573" width="225" height="26" rx="4" class="label-bg"/>
  <text x="462" y="593" text-anchor="middle" class="label">when selection is embodied</text>

  <path class="arrow" d="M 530 705 H 690"/>
  <rect x="557" y="676" width="106" height="24" rx="4" class="label-bg"/>
  <text x="610" y="695" text-anchor="middle" class="label">produces</text>

  <path class="conditional" d="M 895 650 V 600 H 1175 V 468 H 1120"/>
  <rect x="921" y="576" width="247" height="47" rx="5" class="label-bg"/>
  <text x="1044" y="596" text-anchor="middle" class="label">bodily and sensory consequence</text>
  <text x="1044" y="617" text-anchor="middle" class="label">may occasion inquiry</text>

  <line x1="345" y1="820" x2="415" y2="820" class="arrow"/>
  <text x="430" y="826" class="small">intrinsic activity</text>
  <line x1="665" y1="820" x2="735" y2="820" class="conditional"/>
  <text x="750" y="826" class="small">conditional relation</text>

  <text x="600" y="884" text-anchor="middle" class="body">Model hypothesis: the complete cycle may recur without bodily execution.</text>
  <text x="600" y="912" text-anchor="middle" class="small">Projection carries indication outward; pratyavartan names the outer orientation's accord with the inner.</text>
  <text x="600" y="943" text-anchor="middle" class="small">Receptivity enables accord; unresolved content may raise inquiry; consequence is not itself pratyavartan.</text>
  <text x="600" y="967" text-anchor="middle" class="small">The technical companion formalises inquiry separately from reflective accord.</text>
</svg>
