<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">Jeevan control-system boundary</title>
  <desc id="desc">A block diagram identifying jeevan as the sentient controller, with bal as its established state and shakti as that state in motion. Sanskar is acquired organisation across buddhi, chitta, vritti, and mun, held to the realised reference at atma. Jeevan is coupled to Satta and coexistence, an ordered temporary embodied interface of prana, heart, medhas, senses, and body, and a relational, social, material, and natural controlled field.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 27px Arial, Helvetica, sans-serif; fill: #172033; }
      .heading { font: 700 24px Arial, Helvetica, sans-serif; fill: #172033; }
      .body { font: 20px Arial, Helvetica, sans-serif; fill: #27364b; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #34445b; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .boundary-label { font: 700 19px Arial, Helvetica, sans-serif; letter-spacing: 0.7px; fill: #92400e; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3.2; marker-end: url(#arrow); }
      .bidirectional { fill: none; stroke: #4f6b85; stroke-width: 2.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .reference-arrow { fill: none; stroke: #527059; stroke-width: 3.2; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; fill-opacity: 0.94; }
    </style>
  </defs>

  <rect width="1200" height="1080" fill="#ffffff"/>

  <!-- Knowledge reference outside the modelled system -->
  <rect x="260" y="25" width="680" height="120" rx="18" fill="#edf8f0" stroke="#527059" stroke-width="3"/>
  <text x="600" y="62" text-anchor="middle" class="heading">Satta and coexistence</text>
  <text x="600" y="94" text-anchor="middle" class="body">Knowledge: facts, rules, and relations</text>
  <text x="600" y="124" text-anchor="middle" class="small">Reality-reference - not an acting controller</text>

  <!-- Human joint form -->
  <rect x="35" y="185" width="1130" height="660" rx="22" fill="#f6faff" stroke="#3b6ea8" stroke-width="3"/>
  <rect x="58" y="169" width="205" height="35" rx="7" fill="#ffffff"/>
  <text x="72" y="194" class="heading">Human joint form</text>

  <!-- The system being modelled -->
  <rect x="75" y="245" width="1050" height="345" rx="20" fill="#fffaf0" stroke="#b45309" stroke-width="5"/>
  <text x="600" y="283" text-anchor="middle" class="boundary-label">SYSTEM BEING MODELLED: JEEVAN</text>
  <text x="600" y="314" text-anchor="middle" class="body">sentient controller and bearer of sanskar</text>

  <rect x="110" y="355" width="430" height="145" rx="14" fill="#fff2d6" stroke="#c77b16" stroke-width="2.5"/>
  <text x="325" y="390" text-anchor="middle" class="heading">State &#8212; bal</text>
  <text x="325" y="423" text-anchor="middle" class="small">active content across all five faculties</text>
  <text x="325" y="450" text-anchor="middle" class="small">sanskar across the four outer faculties</text>
  <text x="325" y="477" text-anchor="middle" class="small">held to realised reference at atma</text>

  <rect x="660" y="355" width="430" height="145" rx="14" fill="#e9f5ff" stroke="#2773a5" stroke-width="2.5"/>
  <text x="875" y="390" text-anchor="middle" class="heading">Motion &#8212; shakti</text>
  <text x="875" y="423" text-anchor="middle" class="small">authenticity, resolve, and visualisation</text>
  <text x="875" y="450" text-anchor="middle" class="small">analysis and selection</text>
  <text x="875" y="477" text-anchor="middle" class="small">outward evidence; inward receptivity</text>

  <!-- State becoming effective as motion within jeevan -->
  <path class="arrow" d="M 540 427 H 660"/>
  <rect x="546" y="399" width="108" height="23" rx="4" class="label-bg"/>
  <text x="600" y="417" text-anchor="middle" class="label">governs motion</text>

  <text x="600" y="533" text-anchor="middle" class="small">Motion carries a direction: set outward it evidences as conduct; set inward,</text>
  <text x="600" y="559" text-anchor="middle" class="small">it produces receptivity to the faculty inward of it.</text>

  <!-- Satta is a reference, not a command source -->
  <path class="reference-arrow" d="M 940 85 H 1142 V 328 H 325 V 355"/>
  <rect x="938" y="205" width="201" height="53" rx="7" class="label-bg"/>
  <text x="1038" y="226" text-anchor="middle" class="label">available for anubhav</text>
  <text x="1038" y="248" text-anchor="middle" class="small">not a command input</text>

  <!-- Temporary embodied interface, outside jeevan but within the human joint form -->
  <rect x="150" y="640" width="900" height="170" rx="15" fill="#eef4fa" stroke="#4f6b85" stroke-width="3"/>
  <text x="600" y="668" text-anchor="middle" class="heading">Temporary embodied interface &#8212; not the bearer of sanskar</text>

  <rect x="180" y="688" width="250" height="100" rx="10" fill="#ffffff" stroke="#4f6b85" stroke-width="2"/>
  <text x="305" y="728" text-anchor="middle" class="heading">Prana</text>
  <text x="305" y="758" text-anchor="middle" class="small">gross&#8211;subtle coupling</text>

  <rect x="475" y="688" width="250" height="100" rx="10" fill="#ffffff" stroke="#4f6b85" stroke-width="2"/>
  <text x="600" y="728" text-anchor="middle" class="heading">Heart</text>
  <text x="600" y="758" text-anchor="middle" class="small">four instincts</text>

  <rect x="770" y="688" width="250" height="100" rx="10" fill="#ffffff" stroke="#4f6b85" stroke-width="2"/>
  <text x="895" y="722" text-anchor="middle" class="heading">Medhas and body</text>
  <text x="895" y="752" text-anchor="middle" class="small">senses, speech, work</text>

  <path class="bidirectional" d="M 430 738 H 475"/>
  <path class="bidirectional" d="M 725 738 H 770"/>

  <path class="arrow" d="M 875 500 V 620 H 730 V 640"/>
  <rect x="790" y="586" width="179" height="25" rx="4" class="label-bg"/>
  <text x="879" y="605" text-anchor="middle" class="label">selected orientation</text>

  <path class="arrow" d="M 150 738 H 82 V 428 H 110"/>
  <rect x="46" y="566" width="234" height="78" rx="7" class="label-bg"/>
  <text x="163" y="586" text-anchor="middle" class="label">sensory and embodied</text>
  <text x="163" y="608" text-anchor="middle" class="label">feedback, which may</text>
  <text x="163" y="630" text-anchor="middle" class="label">occasion inquiry</text>

  <!-- Field in which embodied action has consequences -->
  <rect x="250" y="920" width="700" height="120" rx="18" fill="#f1f0ff" stroke="#6557a5" stroke-width="3"/>
  <text x="600" y="958" text-anchor="middle" class="heading">Controlled field</text>
  <text x="600" y="991" text-anchor="middle" class="body">relationship, work, exchange, and society</text>
  <text x="600" y="1021" text-anchor="middle" class="small">participation in nature</text>

  <path class="arrow" d="M 490 810 V 920"/>
  <rect x="282" y="848" width="202" height="26" rx="4" class="label-bg"/>
  <text x="383" y="868" text-anchor="middle" class="label">speech, action, and work</text>

  <path class="arrow" d="M 710 920 V 810"/>
  <rect x="721" y="838" width="263" height="52" rx="7" class="label-bg"/>
  <text x="852" y="859" text-anchor="middle" class="label">material result and</text>
  <text x="852" y="881" text-anchor="middle" class="label">another's response</text>
</svg>
