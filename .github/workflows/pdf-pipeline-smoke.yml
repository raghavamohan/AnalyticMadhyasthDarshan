name: PDF pipeline smoke

# Exercises the parts of the toolchain that no other workflow reaches.
# studies-index-check.yml runs setup-study-env with node:false, and study-pr.yml
# only fires on labelled study PRs — so the Node/npm/Chrome path and the
# reproducibility of the PDF output itself were previously unverified until a real
# study PR came along. This runs on demand, and automatically when the pipeline
# it covers is touched.
#
# Uses the local `./.github/actions/...` path on purpose: unlike study-pr.yml this
# never checks out a fork, so a PR that changes the action is tested against its
# own version.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: Study slugs to check (space-separated; blank uses the defaults)
        required: false
        default: ''
      runs:
        description: Regenerations per study (minimum 2; raise to hunt an intermittent divergence)
        required: false
        default: '2'
  pull_request:
    paths:
      - "Scripts/_convert_to_pdf.py"
      - "Scripts/_safe_study_html.py"
      - "Scripts/_study_reader.py"
      - "Scripts/_verify_study_svgs.py"
      - "Scripts/_pdf_resource_policy.cjs"
      - "Scripts/_html_to_pdf.js"
      - "Scripts/_pdf_metadata.py"
      - "Scripts/_regenerate_pdf.py"
      - "Scripts/_study_catalog.py"
      - "Scripts/_verify_pdf_reproducible.py"
      - "Scripts/package.json"
      - "Scripts/package-lock.json"
      # markdown renders the HTML every PDF is printed from and pypdf rewrites
      # the metadata that makes it reproducible, so a version change here can
      # move PDF bytes. This is the only check that would notice.
      - "requirements.txt"
      - ".github/actions/setup-study-env/action.yml"
      - ".github/workflows/pdf-pipeline-smoke.yml"

permissions:
  contents: read

concurrency:
  group: pdf-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up study toolchain
        uses: ./.github/actions/setup-study-env

      # Inputs reach the shell as environment variables, never spliced into the
      # run line: a workflow_dispatch value interpolated directly into `run:` is
      # executed as shell. SLUGS stays unquoted on purpose so a space-separated
      # list still splits into separate arguments.
      - name: Regenerate each study and compare bytes
        env:
          RUNS: ${{ github.event.inputs.runs || '2' }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: python Scripts/_verify_pdf_reproducible.py --runs "$RUNS" $SLUGS

      # The pipeline writes in place, so the run leaves regenerated artifacts in
      # the workspace. Nothing is ever committed or pushed — this is informational
      # only, to make it obvious in the log which files a failing run touched.
      - name: Show what the run modified
        if: always()
        run: git status --short
