name: PDF pipeline smoke

# Reproducibility runs only when the shared print dependency graph changes.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: Study slugs to check (space-separated; blank uses the defaults)
        required: false
        default: ''
      runs:
        description: Regenerations per study (minimum 2; raise to hunt an intermittent divergence)
        required: false
        default: '2'
  pull_request:

permissions:
  contents: read

concurrency:
  group: pdf-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select smoke from shared print dependencies
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=$(python Scripts/_artifact_graph.py --changed-print-since "$BASE_SHA")" >> "$GITHUB_OUTPUT"
          fi
  reproducible:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up study toolchain
        uses: ./.github/actions/setup-study-env

      # Inputs reach the shell as environment variables, never spliced into the
      # run line: a workflow_dispatch value interpolated directly into `run:` is
      # executed as shell. SLUGS stays unquoted on purpose so a space-separated
      # list still splits into separate arguments.
      - name: Regenerate each study and compare bytes
        env:
          RUNS: ${{ github.event.inputs.runs || '2' }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: python Scripts/_verify_pdf_reproducible.py --runs "$RUNS" $SLUGS

      # Only ignored PDFs are written; published readers and global catalogs stay intact.
      - name: Show what the run modified
        if: always()
        run: git status --short
