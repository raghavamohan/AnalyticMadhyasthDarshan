name: Submission portal Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/worker/**"
      - ".github/workflows/submission-worker-deploy.yml"
  push:
    branches: [master]
    paths:
      - "infra/worker/**"
      - ".github/workflows/submission-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: submission-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Worker bundle
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
