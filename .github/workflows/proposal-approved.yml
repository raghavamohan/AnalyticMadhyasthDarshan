name: Proposal approved

on:
  issues:
    types:
      - labeled
  # Lets the bootstrap be exercised without burning a real proposal. The comment
  # job stays keyed on the label, so a dispatch runs the bootstrap only.
  workflow_dispatch:
    inputs:
      issue:
        description: Proposal issue number to bootstrap
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  comment:
    if: github.event.label.name == 'proposal-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure study-proposal label remains
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const labels = (context.payload.issue.labels || []).map((l) => l.name);
            const toAdd = ['study-proposal', 'proposal-approved'].filter((name) => !labels.includes(name));
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: toAdd,
              });
            }

      - name: Post approval instructions
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const issueNumber = issue.number;
            const portalBase = 'https://analyticmadhyasthdarshan.org/Studies/submit.html';
            const portalHubUrl = portalBase;
            const portalSubmitUrl = portalBase + '?tab=submit&proposal=' + issueNumber;
            const prUrl =
              `https://github.com/${repo}/compare/master...master?` +
              `quick_pull=1&labels=new-study&` +
              `title=Add+study&` +
              `body=${encodeURIComponent(
                '## New study\n\n' +
                `Proposal issue: #${issueNumber}\n` +
                'Slug: <!-- e.g. My-New-Study -->\n' +
                'Tags: MVD, SB, JV\n\n' +
                '### Summary\n\n' +
                '<!-- Briefly describe the study question and primary texts -->\n\n' +
                '### Checklist\n\n' +
                '- [ ] Linked proposal issue is labeled `proposal-approved`\n' +
                '- [ ] `Studies/<Slug>/<Slug>.md` follows format in Studies/README.md\n' +
                '- [ ] References link to `References/` where permitted; no restricted uploads\n' +
                '- [ ] Applied label **`new-study`** to this pull request\n'
              )}`;

            const body = [
              '### Proposal approved',
              '',
              'Thank you — this study proposal is approved. The card on **My Submissions** will show **Preparing workspace** while approved proposal metadata is registered. Submit the draft only after it changes to **Ready for draft**. The study then appears on the public index as **Planned**, without a public read/download link, until your first draft pull request is merged.',
              '',
              '#### Recommended: Web Submission Portal',
              '',
              '1. Open [**My Submissions**](' + portalHubUrl + ') and sign in with GitHub.',
              '2. Find proposal **#' + issueNumber + '** in your list — when the row shows **Ready for draft**, click **Submit draft**.',
              '3. Or open the [**submit form**](' + portalSubmitUrl + ') directly (proposal issue # pre-filled).',
              '4. The study slug is fixed from the approved proposal — paste your full markdown draft.',
              '5. Submit the form — a pull request will be opened automatically. Track CI on the same page.',
              '',
              'CI will verify this issue is approved, register the study in the catalog as **Draft** on merge, and build a verified PDF for review.',
              '',
              '<details>',
              '<summary><strong>Advanced: submit via GitHub (fork and pull request)</strong></summary>',
              '',
              '1. **Fork** the repository and create a branch.',
              '2. Add `Studies/<Slug>/<Slug>.md` following the format in [Studies/README.md](https://github.com/' + repo + '/blob/master/Studies/README.md).',
              '3. Open a pull request with the [**new-study** template](https://github.com/' + repo + '/compare/master...master?expand=1&template=new-study.md).',
              '4. Set `Proposal issue: #' + issueNumber + '` in the PR body.',
              '5. Apply the **`new-study`** label to the PR.',
              '',
              '[Open a new-study pull request](' + prUrl + ')',
              '',
              '</details>',
              '',
              'To **update** an existing study later, use **Update a study** on My Submissions. To **release** or **revert to draft**, use **Change release status** or the row actions on a merged study.',
              '',
              'Full guide: [CONTRIBUTING.md](https://github.com/' + repo + '/blob/master/CONTRIBUTING.md).'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  # Lands the pre-catalog study through a pull request rather than pushing to
  # master. The default-branch ruleset requires a pull request and has no bypass
  # actors, and a bypass for the GitHub Actions app is an organization feature
  # that a user-owned repository cannot grant -- so a direct push here is not
  # merely discouraged, it is refused. This job last pushed successfully on
  # 2026-07-03, six days before that ruleset was created.
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'proposal-approved'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
    concurrency:
      group: proposal-bootstrap-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Check settings and resume the proposal branch
        id: workspace
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python Scripts/_bootstrap_ci.py prepare --issue "$ISSUE_NUMBER"

      - name: Set up study toolchain
        if: steps.workspace.outputs.complete != 'true'
        uses: ./.github/actions/setup-study-env
        with:
          node: 'false'

      - name: Bootstrap metadata and Planned catalog row
        if: steps.workspace.outputs.complete != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python Scripts/_bootstrap_proposal_study.py --issue "$ISSUE_NUMBER" --skip-issue-update

      - name: Synchronize generated PDF Worker allowlist
        if: steps.workspace.outputs.complete != 'true'
        run: python Scripts/_publish_generated_pdf_worker.py --sync-keys

      - name: Commit complete bootstrap outputs
        if: steps.workspace.outputs.complete != 'true'
        id: commit
        uses: ./.github/actions/commit-artifacts
        with:
          contract: 'true'
          message: "ci: prepare proposal workspace"

      - name: Verify the exact head, merge, and queue publication
        if: steps.workspace.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Scripts/_bootstrap_ci.py verify-merge --issue "$ISSUE_NUMBER"

      - name: Report workspace preparation failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '### Proposal automation needs maintainer attention\n\nA preparation or publication step failed. Inspect this workflow run and retry after resolving the error. Any workspace already merged remains intact.',
            });

      - name: Confirm that the proposal workspace is ready
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '### Draft workspace ready\n\nThe verified Planned workspace has landed. Refresh **My Submissions**; the proposal now shows **Ready for draft** and the locked draft form is available.',
            });

      - name: Report when there was nothing to bootstrap
        if: steps.workspace.outputs.complete == 'true'
        run: echo "Bootstrap produced no changes for issue #$ISSUE_NUMBER; nothing to merge."
