name: Proposal approved

on:
  issues:
    types:
      - labeled
  # Lets the bootstrap be exercised without burning a real proposal. The comment
  # job stays keyed on the label, so a dispatch runs the bootstrap only.
  workflow_dispatch:
    inputs:
      issue:
        description: Proposal issue number to bootstrap
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.label.name == 'proposal-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure study-proposal label remains
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const labels = (context.payload.issue.labels || []).map((l) => l.name);
            const toAdd = ['study-proposal', 'proposal-approved'].filter((name) => !labels.includes(name));
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: toAdd,
              });
            }

      - name: Post approval instructions
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const issueNumber = issue.number;
            const portalBase = 'https://analyticmadhyasthdarshan.org/Studies/submit.html';
            const portalHubUrl = portalBase;
            const portalSubmitUrl = portalBase + '?tab=submit&proposal=' + issueNumber;
            const prUrl =
              `https://github.com/${repo}/compare/master...master?` +
              `quick_pull=1&labels=new-study&` +
              `title=Add+study&` +
              `body=${encodeURIComponent(
                '## New study\n\n' +
                `Proposal issue: #${issueNumber}\n` +
                'Slug: <!-- e.g. My-New-Study -->\n' +
                'Tags: MVD, SB, JV\n\n' +
                '### Summary\n\n' +
                '<!-- Briefly describe the study question and primary texts -->\n\n' +
                '### Checklist\n\n' +
                '- [ ] Linked proposal issue is labeled `proposal-approved`\n' +
                '- [ ] `Studies/<Slug>/<Slug>.md` follows format in Studies/README.md\n' +
                '- [ ] References link to `References/` where permitted; no restricted uploads\n' +
                '- [ ] Applied label **`new-study`** to this pull request\n'
              )}`;

            const body = [
              '### Proposal approved',
              '',
              'Thank you — this study proposal is approved. A pre-catalog study directory will be created on the default branch (proposal stub markdown, HTML, and PDF). The study appears on the public index as **Planned**, without a public read/download link, until your first draft pull request is merged.',
              '',
              '#### Recommended: Web Submission Portal',
              '',
              '1. Open [**My Submissions**](' + portalHubUrl + ') and sign in with GitHub.',
              '2. Find proposal **#' + issueNumber + '** in your list — when the row shows **Ready for draft**, click **Submit draft**.',
              '3. Or open the [**submit form**](' + portalSubmitUrl + ') directly (proposal issue # pre-filled).',
              '4. The study slug is fixed from the approved proposal — paste your full markdown draft.',
              '5. Submit the form — a pull request will be opened automatically. Track CI on the same page.',
              '',
              'CI will verify this issue is approved, register the study in the catalog as **Draft** on merge, and regenerate the PDF on your PR branch.',
              '',
              '<details>',
              '<summary><strong>Advanced: submit via GitHub (fork and pull request)</strong></summary>',
              '',
              '1. **Fork** the repository and create a branch.',
              '2. Add `Studies/<Slug>/<Slug>.md` following the format in [Studies/README.md](https://github.com/' + repo + '/blob/master/Studies/README.md).',
              '3. Open a pull request with the [**new-study** template](https://github.com/' + repo + '/compare/master...master?expand=1&template=new-study.md).',
              '4. Set `Proposal issue: #' + issueNumber + '` in the PR body.',
              '5. Apply the **`new-study`** label to the PR.',
              '',
              '[Open a new-study pull request](' + prUrl + ')',
              '',
              '</details>',
              '',
              'To **update** an existing study later, use **Update a study** on My Submissions. To **release** or **revert to draft**, use **Change release status** or the row actions on a merged study.',
              '',
              'Full guide: [CONTRIBUTING.md](https://github.com/' + repo + '/blob/master/CONTRIBUTING.md).'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  # Lands the pre-catalog study through a pull request rather than pushing to
  # master. The default-branch ruleset requires a pull request and has no bypass
  # actors, and a bypass for the GitHub Actions app is an organization feature
  # that a user-owned repository cannot grant -- so a direct push here is not
  # merely discouraged, it is refused. This job last pushed successfully on
  # 2026-07-03, six days before that ruleset was created.
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'proposal-approved'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
    concurrency:
      # Serialize bootstrap merges to master so they do not stack with each other
      # or with a Pages deploy still syncing the ~300 MB site.
      group: master-bootstrap-push
      cancel-in-progress: false
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7

      - name: Set up study toolchain
        uses: ./.github/actions/setup-study-env

      - name: Bootstrap pre-catalog study directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python Scripts/_bootstrap_proposal_study.py --issue "$ISSUE_NUMBER" --force

      # Pushes a side branch; nothing reaches master until the merge below, so
      # `pushed` is what tells the next steps whether there is anything to land.
      - name: Commit bootstrap artifacts to a branch
        id: commit
        uses: ./.github/actions/commit-artifacts
        with:
          paths: Studies
          branch: ci/bootstrap-proposal-${{ github.event.issue.number || inputs.issue }}
          message: "ci: bootstrap pre-catalog proposal study (issue #${{ github.event.issue.number || inputs.issue }})"

      # The merge is what lands on master and starts a Pages build, so the wait
      # belongs here rather than before the branch push.
      - name: Wait for in-flight GitHub Pages deploy on master
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Checking for in-flight pages-build-deployment on master..."
          for attempt in $(seq 1 30); do
            count="$(gh run list --workflow=pages-build-deployment --branch=master --limit=1 --json databaseId --jq 'length')"
            if [ "$count" = "0" ]; then
              echo "No recent Pages runs on master; continuing after cool-down."
              break
            fi
            status="$(gh run list --workflow=pages-build-deployment --branch=master --limit=1 --json status --jq '.[0].status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(gh run list --workflow=pages-build-deployment --branch=master --limit=1 --json conclusion --jq '.[0].conclusion // "unknown"')"
              echo "Latest Pages run finished ($conclusion)."
              break
            fi
            echo "Pages deploy still $status; waiting 15s ($attempt/30)..."
            sleep 15
          done
          echo "Cool-down before master merge..."
          sleep 60

      # A pull request opened with GITHUB_TOKEN does not trigger workflows, so no
      # checks run on it -- the same coverage the direct push had, and the reason
      # the required `verify` check does not block this merge. Merged with
      # --merge, never --squash: a squash would carry the regen commit's
      # [skip ci] onto master and suppress the post-merge index check.
      - name: Open and merge the bootstrap pull request
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci/bootstrap-proposal-${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          gh pr create --base master --head "$BRANCH" \
            --title "ci: bootstrap pre-catalog study for proposal #$ISSUE_NUMBER" \
            --body "Automated pre-catalog stub for #$ISSUE_NUMBER. The study appears on the public index as Planned, without a public read/download link, until the first draft pull request merges."
          gh pr merge "$BRANCH" --merge --delete-branch

      - name: Report when there was nothing to bootstrap
        if: steps.commit.outputs.pushed != 'true'
        run: echo "Bootstrap produced no changes for issue #$ISSUE_NUMBER; nothing to merge."
