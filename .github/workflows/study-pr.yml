name: Study PR

# Do not trigger on pull_request edited — body/checklist edits must not rerun
# the full PDF pipeline (Puppeteer). Use synchronize (new commits) or labeled
# (first application of new-study / study-update / status-change).
#
# `opened` is intentionally omitted. The job requires a study label (see `if`
# below), so creating a PR with its label fires BOTH `opened` and `labeled`,
# spawning two runs on the same commit. With cancel-in-progress that cancels
# one; branch protection then keys the required `study-pr` check on the
# cancelled run and blocks the merge — and because the successful run already
# pushed a `[skip ci]` regen commit, no `synchronize` event re-runs it, so the
# PR is stranded until the cancelled run is manually re-run. Triggering on
# `labeled` alone yields exactly one run for the create-with-label flow;
# `synchronize` and `reopened` cover later commits and reopens.

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - labeled

permissions:
  actions: write
  contents: write
  pull-requests: write
  # Rename handling patches the linked proposal issue's slug and title.
  issues: write

concurrency:
  group: study-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  study-pr:
    if: |
      contains(github.event.pull_request.labels.*.name, 'new-study') ||
      contains(github.event.pull_request.labels.*.name, 'study-update') ||
      contains(github.event.pull_request.labels.*.name, 'status-change')
    runs-on: ubuntu-latest
    steps:
      # checkout v7 refuses to check out a fork's head under pull_request_target
      # or workflow_run. This job checks out exactly that head, and is only safe
      # because it triggers on plain `pull_request`, where the token is read-only
      # for a fork. Switching this workflow to pull_request_target would not just
      # be a privilege escalation -- the checkout itself would stop working.
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}

      # Referenced by owner/repo/path@ref rather than `./`, because the checkout
      # above deliberately targets the PR head — which for a fork PR is the
      # fork's tree. A relative `uses:` would look for the action there and fail
      # with "Can't find 'action.yml'" on any fork whose branch predates it.
      # Resolving from master also stops a study PR from altering the toolchain
      # its own required check runs on. Pipeline changes to these actions are
      # still exercised by studies-index-check.yml, which uses the local path.
      - name: Set up study toolchain
        uses: raghavamohan/AnalyticMadhyasthDarshan/.github/actions/setup-study-env@master

      - name: Check study PR router
        run: python Scripts/_test_ci_study_pr.py

      - name: Run study PR pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Scripts/_ci_study_pr.py --base-ref origin/${{ github.event.pull_request.base.ref }}

      - name: Commit regenerated artifacts
        id: commit_artifacts
        uses: raghavamohan/AnalyticMadhyasthDarshan/.github/actions/commit-artifacts@master
        with:
          paths: Studies References Applications
          message: "ci: regenerate study artifacts"

      # Pushes authenticated with GITHUB_TOKEN do not emit a new pull_request
      # workflow run. Explicit dispatch is the supported exception, and makes
      # the required `verify` check report on the regenerated head commit.
      - name: Verify regenerated PR head
        if: steps.commit_artifacts.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run studies-index-check.yml --ref "$HEAD_REF"
