name: Study check

# Called by the unfiltered required verifier. Never commits or publishes.
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  markdown:
    runs-on: ubuntu-latest
    outputs:
      presentations_changed: ${{ steps.plan.outputs.presentations_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan affected build families from the exact upstream base
        id: plan
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: python Scripts/_pdf_build_cache.py --keys --changed-since "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-study-env
        with:
          node: ${{ steps.plan.outputs.markdown_changed == 'true' && 'true' || 'false' }}
      - name: Render and verify affected Markdown PDFs
        if: steps.plan.outputs.markdown_changed == 'true'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: python Scripts/_build_markdown_pdfs.py --changed-since "$BASE_SHA" --output-root "$RUNNER_TEMP/study-review-pdfs"
      - name: Verify affected reference sources
        if: steps.plan.outputs.references_changed == 'true'
        run: |
          python Scripts/_reference_artifacts.py --check
          python Scripts/_rewrite_manifest_reference_links.py --check
      - name: Require committed generated outputs to match
        run: python Scripts/_generated_artifacts.py --check-clean
      - uses: actions/upload-artifact@v6
        if: steps.plan.outputs.markdown_changed == 'true'
        with:
          name: study-review-pdfs
          path: ${{ runner.temp }}/study-review-pdfs
          retention-days: 14
          if-no-files-found: error
  presentations:
    needs: markdown
    if: needs.markdown.outputs.presentations_changed == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\presentation-renderers
          key: presentation-renderer-${{ runner.os }}-${{ hashFiles('Scripts/presentation-pipeline.json') }}
      - name: Install exact production renderer
        shell: pwsh
        run: ./Scripts/_install_presentation_renderer.ps1 -Profile libreoffice-production -CacheDirectory "$env:RUNNER_TEMP\presentation-renderers"
      - name: Build and verify presentations
        shell: pwsh
        run: python Scripts/_build_presentations.py --all --profile libreoffice-production --output-root "$env:RUNNER_TEMP\presentation-review-pdfs"
      - uses: actions/upload-artifact@v6
        with:
          name: presentation-review-pdfs
          path: ${{ runner.temp }}\presentation-review-pdfs
          retention-days: 14
          if-no-files-found: error
