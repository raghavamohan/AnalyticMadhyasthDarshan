name: Agent-facing Workers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".well-known/agent-skills/**"
      - ".well-known/mcp/**"
      - ".well-known/api-catalog"
      - "auth.md"
      - "infra/auth-md-worker/**"
      - "infra/reader-skills/**"
      - "infra/agent-skills-worker/**"
      - "infra/mcp-worker/**"
      - "infra/api-catalog-worker/**"
      - "infra/worker/**"
      - "infra/discussions-worker/**"
      - "infra/shared/**"
      - "openapi/**"
      - "api-docs.html"
      - "Studies/submit.html"
      - "Studies/index.html"
      - "Studies/portal/**"
      - "Studies/assets/discuss.js"
      - "Studies/start-here.json"
      - "Studies/catalog-*.json"
      - "sitemap.xml"
      - "Scripts/_build_agent_skills_index.py"
      - "Scripts/_build_studies_index.py"
      - "Scripts/_build_sitemap.py"
      - "Scripts/_verify_studies_index.py"
      - "Scripts/_worker_deployment.py"
      - "Scripts/_cloudflare_performance.py"
      - "Scripts/_build_contributor_assets.py"
      - "Scripts/_build_discussion_pages.py"
      - "Scripts/_discussion_assets.py"
      - "Scripts/_publish_agent_skills_snippet.py"
      - "Scripts/_publish_mcp_server_card.py"
      - "Scripts/_publish_api_catalog_snippet.py"
      - "Scripts/_publish_auth_md_snippet.py"
      - "Scripts/_test_agent_skills.py"
      - "Scripts/_test_mcp_server_card.py"
      - "Scripts/_test_api_catalog.py"
      - "Scripts/_validate_openapi.py"
      - "Scripts/requirements-api.txt"
      - "Scripts/_test_mcp_api_errors.mjs"
      - "Scripts/_test_generated_worker_bundles.py"
      - "Scripts/_test_auth_md.py"
      - "Scripts/_test_studies_api.py"
      - ".github/workflows/agent-publications.yml"
  push:
    branches: [master]
    paths:
      - ".agents/skills/**"
      - ".well-known/agent-skills/**"
      - ".well-known/mcp/**"
      - ".well-known/api-catalog"
      - "auth.md"
      - "infra/auth-md-worker/**"
      - "infra/reader-skills/**"
      - "infra/agent-skills-worker/**"
      - "infra/mcp-worker/**"
      - "infra/api-catalog-worker/**"
      - "infra/worker/**"
      - "infra/discussions-worker/**"
      - "infra/shared/**"
      - "openapi/**"
      - "api-docs.html"
      - "Studies/submit.html"
      - "Studies/index.html"
      - "Studies/portal/**"
      - "Studies/assets/discuss.js"
      - "Studies/start-here.json"
      - "Studies/catalog-*.json"
      - "sitemap.xml"
      - "Scripts/_build_agent_skills_index.py"
      - "Scripts/_build_studies_index.py"
      - "Scripts/_build_sitemap.py"
      - "Scripts/_verify_studies_index.py"
      - "Scripts/_worker_deployment.py"
      - "Scripts/_cloudflare_performance.py"
      - "Scripts/_build_contributor_assets.py"
      - "Scripts/_build_discussion_pages.py"
      - "Scripts/_discussion_assets.py"
      - "Scripts/_publish_agent_skills_snippet.py"
      - "Scripts/_publish_mcp_server_card.py"
      - "Scripts/_publish_api_catalog_snippet.py"
      - "Scripts/_publish_auth_md_snippet.py"
      - "Scripts/_test_agent_skills.py"
      - "Scripts/_test_mcp_server_card.py"
      - "Scripts/_test_api_catalog.py"
      - "Scripts/_validate_openapi.py"
      - "Scripts/requirements-api.txt"
      - "Scripts/_test_mcp_api_errors.mjs"
      - "Scripts/_test_generated_worker_bundles.py"
      - "Scripts/_test_auth_md.py"
      - "Scripts/_test_studies_api.py"
      - ".github/workflows/agent-publications.yml"

permissions:
  contents: read

concurrency:
  group: agent-publications-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up study toolchain
        uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate canonical publications
        run: |
          python -m pip install -r Scripts/requirements-api.txt
          python Scripts/_validate_openapi.py
          python Scripts/_build_agent_skills_index.py --check
          python Scripts/_test_agent_skills.py
          python Scripts/_test_mcp_server_card.py
          python Scripts/_test_studies_api.py
          python Scripts/_verify_studies_index.py
          python Scripts/_test_auth_md.py
          python Scripts/_test_api_catalog.py

      - name: Generate Worker bundles
        run: |
          python Scripts/_publish_agent_skills_snippet.py --generate-only
          python Scripts/_publish_mcp_server_card.py --generate-only
          python Scripts/_publish_auth_md_snippet.py --generate-only

      - name: Check generated JavaScript
        run: |
          python Scripts/_test_generated_worker_bundles.py --require-generated
          node --check infra/agent-skills-worker/src/index.js
          node --check infra/mcp-worker/src/index.js
          node --check infra/auth-md-worker/src/index.js
          node Scripts/_test_mcp_api_errors.mjs

      - name: Deploy Agent Skills Worker
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python Scripts/_publish_agent_skills_snippet.py

      - name: Deploy MCP Worker
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python Scripts/_publish_mcp_server_card.py

      - name: Deploy Auth.md Worker
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python Scripts/_publish_auth_md_snippet.py

      - name: Deploy API catalog Worker
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python Scripts/_publish_api_catalog_snippet.py

      - name: Verify live publications
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          # OpenAPI files belong to the parallel coherent-site publication.
          # Verify only the route this workflow deploys in the final command.
          for attempt in 1 2 3 4 5; do
            if python Scripts/_test_agent_skills.py --live && \
               python Scripts/_test_mcp_server_card.py --live && \
               python Scripts/_test_studies_api.py --live && \
               python Scripts/_test_auth_md.py --live && \
               python Scripts/_test_api_catalog.py --live-catalog-only; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "Live publication verification attempt $attempt failed; waiting for edge propagation."
            sleep 10
          done
