name: Generated PDF publish

# One graph selects output keys from verified active-publication receipts.
# Unchanged families do not start renderer jobs or transfer PDF ZIPs.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      force_rebuild:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      reference_pdfs: ${{ steps.reuse.outputs.reference_pdfs || steps.plan.outputs.reference_pdfs }}
      markdown: ${{ steps.reuse.outputs.markdown || steps.plan.outputs.markdown }}
      presentations: ${{ steps.reuse.outputs.presentations || steps.plan.outputs.presentations }}
      references: ${{ steps.reuse.outputs.references || steps.plan.outputs.references }}
      any_build: ${{ steps.reuse.outputs.any_build || steps.plan.outputs.any_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
      - name: Plan against verified active publication
        id: plan
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AMD_REFERENCE_R2_BUCKET: ${{ vars.REFERENCE_R2_BUCKET_NAME }}
          FORCE: ${{ inputs.force_rebuild }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python Scripts/_publication_plan.py --output "$RUNNER_TEMP/publication-plan.json" --github-output "$GITHUB_OUTPUT" "${args[@]}"
      - name: Reuse verified builds from the merged same-repository PR
        id: reuse
        if: ${{ !inputs.force_rebuild }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Scripts/_review_artifacts.py --import-plan "$RUNNER_TEMP/publication-plan.json" --root "$RUNNER_TEMP/reviewed-pdfs"
      - uses: actions/upload-artifact@v6
        if: steps.reuse.outputs.review_used == 'true'
        with:
          name: generated-reviewed-pdfs
          path: ${{ runner.temp }}/reviewed-pdfs
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: publication-plan
          path: ${{ runner.temp }}/publication-plan.json
          if-no-files-found: error
          retention-days: 14

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
      - name: Validate the exact publication commit
        run: |
          python Scripts/_verify_studies_index.py
          python Scripts/_sync_glossary_html.py --check
          python Scripts/_sync_agent_rules.py --check
          python Scripts/_reference_artifacts.py --check
          python Scripts/_rewrite_manifest_reference_links.py --check
          python Scripts/_run_test_suites.py
          python Scripts/_generated_artifacts.py --check-clean

  pdfs:
    needs: plan
    if: needs.plan.outputs.markdown == 'true' || needs.plan.outputs.reference_pdfs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: publication-plan
          path: ${{ runner.temp }}
      - uses: ./.github/actions/setup-study-env
        with:
          node: ${{ needs.plan.outputs.markdown == 'true' && 'true' || 'false' }}
      - name: Restore reusable protected document builds
        if: needs.plan.outputs.markdown == 'true' && !inputs.force_rebuild
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/document-pdf-cache
          key: pdf-documents-v2-${{ runner.os }}-${{ inputs.source_sha }}
          restore-keys: pdf-documents-v2-${{ runner.os }}-
      - name: Build selected Markdown PDFs
        if: needs.plan.outputs.markdown == 'true'
        run: python Scripts/_build_markdown_pdfs.py --plan "$RUNNER_TEMP/publication-plan.json" --output-root "$RUNNER_TEMP/generated-pdfs" --cache-root "$RUNNER_TEMP/document-pdf-cache"
      - name: Stage selected approved reference PDFs
        if: needs.plan.outputs.reference_pdfs == 'true'
        run: python Scripts/_build_reference_pdfs.py --plan "$RUNNER_TEMP/publication-plan.json" --output-root "$RUNNER_TEMP/generated-pdfs"
      - uses: actions/upload-artifact@v6
        with:
          name: generated-markdown-pdfs
          path: ${{ runner.temp }}/generated-pdfs
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.plan.outputs.markdown == 'true'
        with:
          path: ${{ runner.temp }}/document-pdf-cache
          key: pdf-documents-v2-${{ runner.os }}-${{ inputs.source_sha }}

  presentations:
    needs: plan
    if: needs.plan.outputs.presentations == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: publication-plan
          path: ${{ runner.temp }}
      - uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\presentation-renderers
          key: presentation-renderer-${{ runner.os }}-${{ hashFiles('Scripts/presentation-pipeline.json') }}
      - name: Install exact production renderer
        shell: pwsh
        run: ./Scripts/_install_presentation_renderer.ps1 -Profile libreoffice-production -CacheDirectory "$env:RUNNER_TEMP\presentation-renderers"
      - name: Build selected deck pairs
        shell: pwsh
        run: python Scripts/_build_presentations.py --plan "$env:RUNNER_TEMP\publication-plan.json" --profile libreoffice-production --output-root "$env:RUNNER_TEMP\generated-pdfs"
      - uses: actions/upload-artifact@v6
        with:
          name: generated-presentation-pdfs
          path: ${{ runner.temp }}\generated-pdfs
          if-no-files-found: error
          retention-days: 7

  coherent-site:
    needs: [plan, validate, pdfs, presentations]
    if: >-
      always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.validate.result == 'success' &&
      (needs.pdfs.result == 'success' || needs.pdfs.result == 'skipped') &&
      (needs.presentations.result == 'success' || needs.presentations.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: github-pages
    env:
      PYTHONUNBUFFERED: '1'
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_REGION: ${{ vars.R2_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AMD_REFERENCE_R2_BUCKET: ${{ vars.REFERENCE_R2_BUCKET_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
      - uses: actions/download-artifact@v7
        with:
          name: publication-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.any_build == 'true'
        with:
          pattern: generated-*-pdfs
          path: ${{ runner.temp }}/downloaded-pdfs
      - name: Combine partial builds and preserve every deck proof
        if: needs.plan.outputs.any_build == 'true'
        run: python Scripts/_review_artifacts.py --merge-downloads "$RUNNER_TEMP/downloaded-pdfs" --root "$RUNNER_TEMP/generated-pdfs"
      - name: Publish selected reference objects
        if: needs.plan.outputs.references == 'true'
        run: python Scripts/_publish_reference_artifacts.py --upload-approved --plan "$RUNNER_TEMP/publication-plan.json" --artifact-root "$RUNNER_TEMP/generated-pdfs"
      - name: Verify approved reference objects before promotion
        run: python Scripts/_publish_reference_artifacts.py --verify-approved
      - name: Build release using new PDFs and verified R2 records
        run: python Scripts/_site_release.py --plan "$RUNNER_TEMP/publication-plan.json" --artifact-root "$RUNNER_TEMP/generated-pdfs" --output-root "$RUNNER_TEMP/site-release"
      - uses: actions/upload-artifact@v6
        with:
          name: site-release-manifest
          path: |
            ${{ runner.temp }}/site-release/release.json
            ${{ runner.temp }}/site-release/build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage, audit, and promote the release
        env:
          PROMOTE: ${{ vars.SITE_RELEASES_ENABLED }}
        run: |
          args=()
          if [ "$PROMOTE" = "true" ]; then args+=(--promote); fi
          python Scripts/_publish_site_release.py --release-root "$RUNNER_TEMP/site-release" "${args[@]}"
