name: Studies index

# Deliberately unfiltered. This job is the repository's cheap, always-run guard:
# Python only, no Node, no Chrome, ~1 minute with a warm pip cache.
#
# It used to carry two verbatim copies of a fifteen-entry `paths:` list, one per
# trigger, which was easy to half-edit and easy to outgrow. It had already been
# outgrown: the suites this job now runs read `infra/`, `.agents/skills/`,
# `.well-known/`, `AGENTS.md` and `Studies/glossary.json`, none of which any
# filter listed -- so the PRs most likely to break them were the ones that would
# not have triggered the check.
#
# Running unconditionally also makes this the one workflow that reports on every
# pull request, which is what a required status check needs. `study-pr.yml`
# cannot be required: it omits the `opened` trigger by design, so a PR opened
# without a study label produces no run at all and the check would sit pending
# forever.

on:
  workflow_dispatch:
    inputs:
      report_sha:
        description: >-
          Optional regenerated PR-head SHA whose required verify commit status
          this dispatch must complete.
        required: false
        type: string
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate regenerated PR-head status target
        if: github.event_name == 'workflow_dispatch' && inputs.report_sha != ''
        id: dispatch_target
        shell: bash
        env:
          REPORT_SHA: ${{ inputs.report_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REPORT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid report SHA::report_sha must be a full lowercase Git commit SHA."
            exit 1
          fi
          echo "sha=$REPORT_SHA" >> "$GITHUB_OUTPUT"

      # The study workflow can only link its queued status to this workflow's
      # runs page. As soon as the dispatched verifier starts, point that same
      # required status at this exact run so a pending PR never appears idle.
      - name: Link regenerated-head status to this verifier run
        if: steps.dispatch_target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_SHA: ${{ steps.dispatch_target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$REPORT_SHA" \
            -f state=pending \
            -f context=verify \
            -f description="Regenerated-head verification is running." \
            -f target_url="$RUN_URL"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirm regenerated PR head
        if: steps.dispatch_target.outputs.sha != ''
        shell: bash
        env:
          REPORT_SHA: ${{ steps.dispatch_target.outputs.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$REPORT_SHA" != "$CHECKED_OUT_SHA" ]; then
            echo "::error title=Verification ref moved::Expected $REPORT_SHA but checked out $CHECKED_OUT_SHA."
            exit 1
          fi

      # Verification only — no PDF rendering, so Node and Chrome are not installed.
      - name: Set up study toolchain
        uses: ./.github/actions/setup-study-env
        with:
          node: 'false'

      - name: Verify catalog JSON and index shell
        run: python Scripts/_verify_studies_index.py

      # Runs every Scripts/_test_*.py except the few held back in that script's
      # HELD map, each with a written reason. Discovery is a denylist on purpose:
      # only four of twenty-one suites used to be wired in here by name, and the
      # other seventeen were enforced by nothing because adding a test file did
      # not add it to CI. A new suite is now enforced the moment it lands.
      #
      # Covers, among others: the study-PR router (_test_ci_study_pr), the PDF
      # date-pinning patches (_test_pdf_metadata), the commit-artifacts shell --
      # the only part of CI that writes to a branch, and unreachable from the two
      # labelled workflows that use it -- and the LF-write guard, which reads the
      # source because this Linux runner cannot reproduce the Windows CRLF bug.
      - name: Run the enforced test suites
        run: python Scripts/_run_test_suites.py

      # CLAUDE.md makes this sync mandatory after editing AGENTS.md or any
      # SKILL.md, and nothing verified it, so the mirrors could drift silently.
      - name: Check agent rules and skills mirrors are in sync
        run: python Scripts/_sync_agent_rules.py --check

      # workflow_dispatch check suites are not attached to a pull request even
      # when --ref names its head branch. Complete the pending commit status that
      # study-pr.yml placed on the exact regenerated SHA, so branch rules see the
      # required `verify` result on the current PR head.
      - name: Report regenerated PR-head verification
        if: always() && steps.dispatch_target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_SHA: ${{ steps.dispatch_target.outputs.sha }}
          VERIFY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$REPORT_SHA" \
            -f state="$VERIFY_STATE" \
            -f context=verify \
            -f description="Regenerated PR-head verification $VERIFY_STATE." \
            -f target_url="$RUN_URL"
