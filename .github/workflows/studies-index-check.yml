name: Studies index

on:
  pull_request:
    paths:
      - "Studies/index.html"
      - "Studies/README.md"
      - "Scripts/_build_studies_index.py"
      - "Scripts/_study_catalog.py"
      - "Scripts/_verify_studies_index.py"
      - "Scripts/_ci_study_pr.py"
      - "Scripts/_test_ci_study_pr.py"
      - "Scripts/_pdf_metadata.py"
      - "Scripts/_test_pdf_metadata.py"
      - "Scripts/_build_discussion_pages.py"
      - "Scripts/_build_sitemap.py"
      - "Scripts/_test_commit_artifacts.py"
      - ".github/actions/commit-artifacts/action.yml"
      - "Studies/catalog-*.json"
      - ".github/actions/setup-study-env/action.yml"
      - ".github/workflows/studies-index-check.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "Studies/index.html"
      - "Studies/README.md"
      - "Scripts/_build_studies_index.py"
      - "Scripts/_study_catalog.py"
      - "Scripts/_verify_studies_index.py"
      - "Scripts/_ci_study_pr.py"
      - "Scripts/_test_ci_study_pr.py"
      - "Scripts/_pdf_metadata.py"
      - "Scripts/_test_pdf_metadata.py"
      - "Scripts/_build_discussion_pages.py"
      - "Scripts/_build_sitemap.py"
      - "Scripts/_test_commit_artifacts.py"
      - ".github/actions/commit-artifacts/action.yml"
      - "Studies/catalog-*.json"
      - ".github/actions/setup-study-env/action.yml"
      - ".github/workflows/studies-index-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verification only — no PDF rendering, so Node and Chrome are not installed.
      - name: Set up study toolchain
        uses: ./.github/actions/setup-study-env
        with:
          node: 'false'

      - name: Verify catalog JSON and index shell
        run: python Scripts/_verify_studies_index.py

      - name: Check study PR router
        run: python Scripts/_test_ci_study_pr.py

      - name: Check PDF reproducibility patches
        run: python Scripts/_test_pdf_metadata.py

      # commit-artifacts is the only part of CI that writes to a branch, and the
      # two workflows that use it both need a label to fire -- so without this it
      # reaches master having never been run. study-pr.yml also resolves it as
      # @master, so even a real study PR would test the merged copy, not the
      # branch's.
      - name: Check the commit-artifacts shell
        run: python Scripts/_test_commit_artifacts.py
