name: Studies index

# One unfiltered, required aggregate. Labels never decide whether a study is checked.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      report_sha:
        description: Exact prepared or bootstrap commit to verify
        required: false
        type: string
      pr_number:
        description: PR number for prepared study lifecycle intent (omit for bootstrap)
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.source.outputs.head }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.report_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact source and lifecycle intent
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ inputs.report_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python Scripts/_verify_ci_context.py
      - uses: ./.github/actions/setup-study-env
        with:
          node: 'false'
      - name: Verify study lifecycle without writes
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.source.outputs.base }}
        run: python Scripts/_validate_study_change.py --base-ref "$BASE_SHA" --body-file "$RUNNER_TEMP/verified-pr-body.txt"
      - name: Verify catalog JSON and index shell
        run: python Scripts/_verify_studies_index.py
      - name: Verify shared glossary tooltips in generated study HTML
        run: python Scripts/_sync_glossary_html.py --check
      - name: Run the enforced test suites
        run: python Scripts/_run_test_suites.py
      - name: Check agent rules and skills mirrors are in sync
        run: python Scripts/_sync_agent_rules.py --check
      - name: Require clean verification checkout
        run: python Scripts/_generated_artifacts.py --check-clean
  study-check:
    needs: checks
    uses: ./.github/workflows/study-pr.yml
    with:
      source_sha: ${{ needs.checks.outputs.head }}
      base_sha: ${{ needs.checks.outputs.base }}
  verify:
    permissions:
      contents: read
      statuses: write
    if: always()
    needs: [checks, study-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          STUDY: ${{ needs.study-check.result }}
        run: test "$CHECKS" = success && test "$STUDY" = success
      # GITHUB_TOKEN writes still need an explicit status on the prepared SHA.
      # This bridge is limited to bot preparation and bootstrap; review is pure.
      - name: Report exact prepared-head verification
        if: always() && github.event_name == 'workflow_dispatch' && inputs.report_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ inputs.report_sha }}
          VERIFY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          [[ "$REPORT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$REPORT_SHA" \
            -f state="$VERIFY_STATE" -f context=verify \
            -f description="Complete prepared-head verification $VERIFY_STATE." \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
